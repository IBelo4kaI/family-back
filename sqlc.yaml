version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/adapter/postgres/sqlc/query"
    schema: "./internal/adapter/postgres/migrations"
    gen:
      go:
        package: "repo"
        sql_package: "pgx/v5"
        out: "./internal/adapter/postgres/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        json_tags_case_style: camel
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
